
{% extends "base.html" %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow-lg border-0 rounded-4" style="width: 25rem;">
        <h3 class="text-center fw-bold mb-3"><i class="bi bi-key"></i> Réinitialiser le mot de passe</h3>
        <p class="text-center">Entrez votre email pour recevoir un lien de réinitialisation.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_email" class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control rounded-3" id="id_email" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-3"><i class="bi bi-send"></i> Envoyer</button>
        </form>
    </div>
</div>
{% endblock %}
